name: netplane
version: 0.2.0
description: >-
  Manage a self-hosted Tailscale control plane (Headscale) from Hermes:
  control-plane health, node inventory with online state, and preauth
  join-keys, plus a Desktop dashboard pane.
author: Jeff Watts
kind: standalone
requires_hermes: ">=0.19"
requires_env:
  - name: NETPLANE_APIKEY
    description: "Headscale API key"
    secret: true
config_schema:
  grpc_addr: {type: str, default: "127.0.0.1:50443", description: "Headscale gRPC address"}
  control_url: {type: str, default: "", description: "Control-plane URL shown in status (e.g. https://host.example:8443)"}
python_dependencies:
  - grpcio>=1.81.1,<2
  - protobuf>=6.33.5,<7
provides_tools:
  - netplane_status
  - netplane_nodes
  - netplane_preauth
provides_hooks:
  - pre_tool_call
